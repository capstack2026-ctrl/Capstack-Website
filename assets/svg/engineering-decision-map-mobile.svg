<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" fill="none">
  <title>Engineering foundations to a build-ready system</title><desc>Four engineering foundations connect to a central engineering core and a build-ready system.</desc>
  <style>
    .guide{stroke:#C0C0C0;stroke-width:1;stroke-dasharray:3 7}.line{stroke:#0A0A0A;stroke-width:1.7;fill:none}.node{fill:#FFF;stroke:#0A0A0A;stroke-width:1.25}.core{fill:#F7F7F7;stroke:#0A0A0A;stroke-width:1.7}.output{fill:#0A0A0A}.meta{fill:#5C5C5C;font:9px Arial,sans-serif;letter-spacing:1px}.annotation{fill:#5C5C5C;font:9px Arial,sans-serif;letter-spacing:.9px}.label{fill:#0A0A0A;font:700 15px Arial,sans-serif}.detail{fill:#5C5C5C;font:10px Arial,sans-serif}.inverse-meta{fill:#A3A3A3;font:9px Arial,sans-serif;letter-spacing:1px}.inverse-label{fill:#FFF;font:700 15px Arial,sans-serif}.foundation{opacity:0;transform:translateY(6px);animation:foundation-in .3s ease-out forwards}.foundation--two{animation-delay:.08s}.foundation--three{animation-delay:.16s}.foundation--four{animation-delay:.24s}.connector{stroke-dasharray:180;stroke-dashoffset:180;animation:draw .58s ease-out forwards;animation-delay:.34s}.connector--two{animation-delay:.46s}.connector--three{animation-delay:.58s}.connector--four{animation-delay:.7s}.connector--output{animation-delay:1.04s}.core-group{opacity:0;transform:scale(.94);transform-origin:200px 380px;animation:core-in .3s ease-out forwards;animation-delay:1.1s}.output-group{opacity:0;transform:translateY(-6px);animation:output-in .3s ease-out forwards;animation-delay:1.35s}@keyframes foundation-in{to{opacity:1;transform:translateY(0)}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes core-in{to{opacity:1;transform:scale(1)}}@keyframes output-in{to{opacity:1;transform:translateY(0)}}@media (prefers-reduced-motion:reduce){.foundation,.connector,.core-group,.output-group{animation:none;opacity:1;transform:none;stroke-dashoffset:0}}
    /* Keep the primary engineering map immediately legible on first paint. */
    .foundation,.connector,.core-group,.output-group{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}
  </style>
  <path class="guide" d="M20 42H380M20 42V574M380 42V574"/><text class="meta" x="20" y="25">FOUNDATIONS → CORE → OUTPUT</text>
  <g class="foundation"><rect class="node" x="26" y="82" width="150" height="74"/><text class="annotation" x="38" y="106">01 / FOUNDATION</text><text class="label" x="38" y="132">Architecture</text><text class="detail" x="38" y="147">System structure</text></g><g class="foundation foundation--two"><rect class="node" x="224" y="82" width="150" height="74"/><text class="annotation" x="236" y="106">03 / FOUNDATION</text><text class="label" x="236" y="132">Security</text><text class="detail" x="236" y="147">Access and handling</text></g>
  <g class="foundation foundation--three"><rect class="node" x="26" y="216" width="150" height="74"/><text class="annotation" x="38" y="240">02 / FOUNDATION</text><text class="label" x="38" y="266">Data model</text><text class="detail" x="38" y="281">Information flows</text></g><g class="foundation foundation--four"><rect class="node" x="224" y="216" width="150" height="74"/><text class="annotation" x="236" y="240">04 / FOUNDATION</text><text class="label" x="236" y="266">Performance</text><text class="detail" x="236" y="281">Speed and resilience</text></g>
  <path class="line connector" d="M176 119H190V344"/><path class="line connector connector--two" d="M224 119H210V344"/><path class="line connector connector--three" d="M176 253H190V380"/><path class="line connector connector--four" d="M224 253H210V380"/>
  <g class="core-group"><path class="core" d="M158 334H242L266 380 242 426H158L134 380 158 334Z"/><text class="annotation" x="200" y="370" text-anchor="middle">ENGINEERING</text><text class="label" x="200" y="394" text-anchor="middle">CORE</text><path d="M166 406H234" stroke="#848484" stroke-width="1.5"/></g><path class="line connector connector--output" d="M200 426V462"/>
  <g class="output-group"><rect class="output" x="72" y="462" width="256" height="78"/><text class="inverse-meta" x="92" y="487">OUTPUT / 01</text><text class="inverse-label" x="92" y="516">BUILD-READY SYSTEM</text><path d="M92 526H266" stroke="#848484" stroke-width="1.5"/><rect x="281" y="490" width="24" height="24" stroke="#FFF" stroke-width="1.4"/><path d="m286 502 5 5 9-11" stroke="#FFF" stroke-width="1.4"/></g><text class="annotation" x="20" y="575">CAPSTACK ENGINEERING MAP</text>
</svg>
