  <g class="foundation foundation--two"><rect class="node" x="68" y="440" width="182" height="108"/><text class="annotation" x="88" y="472">02 / FOUNDATION</text><text class="label" x="88" y="507">Data model</text><text class="detail" x="88" y="530">Information flows</text></g>
  <g class="foundation foundation--three"><rect class="node" x="710" y="132" width="182" height="108"/><text class="annotation" x="730" y="164">03 / FOUNDATION</text><text class="label" x="730" y="199">Security</text><text class="detail" x="730" y="222">Access and handling</text></g>
  <g class="foundation foundation--four"><rect class="node" x="710" y="440" width="182" height="108"/><text class="annotation" x="730" y="472">04 / FOUNDATION</text><text class="label" x="730" y="507">Performance</text><text class="detail" x="730" y="530">Speed and resilience</text></g>
