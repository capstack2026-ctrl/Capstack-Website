  <g class="core-group"><path class="core" d="M431 244H529L578 324 529 404H431L382 324 431 244Z"/><text class="annotation" x="480" y="306" text-anchor="middle">ENGINEERING</text><text class="label" x="480" y="335" text-anchor="middle">CORE</text><path d="M440 361H520" stroke="#848484" stroke-width="2"/><text class="annotation" x="480" y="383" text-anchor="middle">DECISIONS SET</text></g><path class="line connector connector--output" d="M578 324H676"/>
