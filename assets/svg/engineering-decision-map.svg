<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" fill="none">
  <title>Engineering foundations to a build-ready system</title><desc>Architecture, data model, security and performance connect through a central engineering core to a build-ready system.</desc>
  <style>
    .guide{stroke:#C0C0C0;stroke-width:1;stroke-dasharray:3 8}.line{stroke:#0A0A0A;stroke-width:2;fill:none;stroke-linecap:square;stroke-linejoin:miter}.node{fill:#FFF;stroke:#0A0A0A;stroke-width:1.5}.core{fill:#F7F7F7;stroke:#0A0A0A;stroke-width:2}.output{fill:#0A0A0A;stroke:#0A0A0A;stroke-width:1.5}.meta{fill:#5C5C5C;font:11px Arial,sans-serif;letter-spacing:1.6px}.annotation{fill:#5C5C5C;font:11px Arial,sans-serif;letter-spacing:1.2px}.label{fill:#0A0A0A;font:700 20px Arial,sans-serif}.detail{fill:#5C5C5C;font:13px Arial,sans-serif}.inverse-meta{fill:#A3A3A3;font:11px Arial,sans-serif;letter-spacing:1.3px}.inverse-label{fill:#FFF;font:700 19px Arial,sans-serif}.foundation{opacity:0;transform:translateY(8px);animation:foundation-in .36s ease-out forwards}.foundation--two{animation-delay:.1s}.foundation--three{animation-delay:.2s}.foundation--four{animation-delay:.3s}.connector{stroke-dasharray:340;stroke-dashoffset:340;animation:draw .72s ease-out forwards;animation-delay:.38s}.connector--two{animation-delay:.5s}.connector--three{animation-delay:.62s}.connector--four{animation-delay:.74s}.connector--output{animation-delay:1.1s}.junction{opacity:0;animation:reveal .18s ease-out forwards;animation-delay:1.08s}.core-group{opacity:0;transform:scale(.94);transform-origin:480px 324px;animation:core-in .36s ease-out forwards;animation-delay:1.16s}.output-group{opacity:0;transform:translateX(-8px);animation:output-in .35s ease-out forwards;animation-delay:1.46s}@keyframes foundation-in{to{opacity:1;transform:translateY(0)}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes reveal{to{opacity:1}}@keyframes core-in{to{opacity:1;transform:scale(1)}}@keyframes output-in{to{opacity:1;transform:translateX(0)}}@media (prefers-reduced-motion:reduce){.foundation,.connector,.junction,.core-group,.output-group{animation:none;opacity:1;transform:none;stroke-dashoffset:0}}
    /* Keep the primary engineering map immediately legible on first paint. */
    .foundation,.connector,.junction,.core-group,.output-group{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}
  </style>
  <path class="guide" d="M52 60H908M52 620H908M52 60V620M908 60V620"/><text class="meta" x="52" y="34">FOUNDATIONS / 04</text><text class="meta" x="741" y="34">OUTPUT / 01</text><text class="meta" x="52" y="652">CAPSTACK ENGINEERING MAP</text>
